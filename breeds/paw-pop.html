<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ねこパートナーの小さな肉球バブルゲーム。肉球を見つけてタップして遊べます。">
  <link rel="icon" type="image/png" href="../assets/neko-partner-favicon.png">
  <link rel="stylesheet" href="paw-pop.css?v=20261001-2">
  <title>肉球バブルで遊ぶ｜ねこパートナー</title>
</head>
<body>
  <header class="game-header"><a href="../index.html" class="brand" aria-label="ねこパートナー トップ"><img src="../assets/neko-partner-logo.png" alt="ねこパートナー"><span>くらしパートナーが運営</span></a><a class="back-link" href="index.html">猫図鑑へ戻る</a></header>
  <main class="game-page">
    <section class="game-intro">
      <p class="eyebrow">PAW BUBBLE POP</p>
      <h1>肉球を、<br>ぽんっと見つけよう。</h1>
      <p>ふわふわ浮かぶ肉球をタップすると、猫から小さなリアクションが届きます。</p>
    </section>
    <section class="game-shell" aria-labelledby="gameTitle">
      <div class="game-topbar"><div><span class="eyebrow">PAW POP CHALLENGE</span><h2 id="gameTitle">肉球バブルポップ</h2></div><div class="game-stats" aria-live="polite"><div class="stat timer-stat"><span>TIME</span><b><i id="timeValue">10</i>s</b></div><div class="stat"><span>POP</span><b id="popsValue">0</b></div><div class="stat score"><span>POINT</span><b id="scoreValue">0</b></div></div></div>
      <div id="pawStage" class="paw-stage" aria-label="肉球バブルをタップするゲーム">
        <div class="stage-photo" aria-hidden="true"></div>
        <div class="stage-wash" aria-hidden="true"></div>
        <div class="stage-copy"><span id="stageMessage">スタートを押すと肉球が現れます。</span></div>
        <div class="cat-comment" id="catComment" aria-live="polite">今日は何個見つけられるかな？</div>
        <button id="startButton" class="start-button" type="button">肉球を探す <span>🐾</span></button>
        <div id="resultOverlay" class="result-overlay" hidden aria-live="polite"><div class="result-card"><span class="result-kicker">ぴっぴー！ TIME UP</span><img src="../assets/pink-paw.png" alt="" aria-hidden="true"><h3 id="resultTitle">肉球ハンター！</h3><p id="resultDescription"></p><button id="resultButton" class="result-button" type="button">もう一度チャレンジ</button></div></div>
      </div>
      <div class="game-footer"><p>「よーい、スタート！」のあと10秒間。レア肉球は約10個に1個、見つけると+2ポイントです。</p><button id="resetButton" class="reset-button" type="button" hidden>やり直す</button></div>
    </section>
  </main>
  <script src="paw-pop.js?v=20261001-2"></script>
</body>
</html>
